# ==========================================
# Adi Anadi Restaurant - Application Config
# ==========================================

spring.application.name=restaurant-backend

# --- Active Profile ---
spring.profiles.active=dev

# --- Server ---
server.port=8080

# --- Timezone ---
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
user.timezone=Asia/Kolkata

# --- MySQL DataSource (values from environment variables) ---
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/restaurant_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:password}

# --- HikariCP ---
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# --- JPA / Hibernate ---
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# --- JWT ---
app.jwt.secret=${JWT_SECRET:ThisIsAVeryLongSecretKeyForJWTThatShouldBeChangedInProduction2024!}
app.jwt.expiration-ms=86400000

# --- App ---
app.cors.allowed-origins=${CORS_ORIGINS:https://adi-anadi-restaurant.vercel.app,http://localhost:5173,http://localhost:3000}

# --- Logging ---
logging.level.com.restaurant=INFO
logging.level.org.springframework.security=WARN
